name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Proje Kontrolü
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm install
        working-directory: backend

      - name: JSON sözdizimini doğrula
        run: node -e "require('./knowledge-base/rules.json'); console.log('rules.json gecerli')"
        working-directory: backend

      - name: Engine sözdizimini doğrula
        run: node --check src/engine.js
        working-directory: backend
